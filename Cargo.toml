[package]
name = "job-queue"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
diesel = { version = "2.3.12", features = ["postgres", "chrono", "numeric", "r2d2"] }
dotenvy = "0.15.7"
protobuf = "3.7.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
